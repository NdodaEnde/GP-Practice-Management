# Frontend (CRA/craco SPA) static deploy — Netlify.
# Backend is deployed separately on Render (see backend/render.yaml).
# Prefer all-Render? The same three settings (build cmd, publish dir, SPA
# rewrite) port to a Render Static Site 1:1.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "build"          # relative to base => frontend/build

[build.environment]
  # CRA bakes REACT_APP_* at BUILD time. Set REACT_APP_BACKEND_URL in the
  # Netlify dashboard (Site settings -> Environment variables) to the prod
  # backend origin, e.g. https://surgiscan-backend.onrender.com — do NOT
  # hardcode it here. Whatever origin this site ends up on MUST also be added
  # to the backend's CORS_ORIGINS.
  CI = "false"               # don't fail the build on lint warnings (CRA default)

# SPA client-side routing: serve index.html for any non-asset path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
