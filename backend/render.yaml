# Render deployment for the SurgiScan FastAPI backend (Supabase-backed).
#
# This deploys the Docker image built from ./Dockerfile (entrypoint server:app).
# Supabase (Postgres + Storage) is an EXTERNAL managed service — there is NO
# Render database here. Set the sync:false secrets in the Render dashboard.
#
# If deploying as a Blueprint, point Render's root directory at `backend/`.
services:
  - type: web
    name: surgiscan-backend
    env: docker
    plan: starter            # bump to standard/pro as load grows
    region: oregon           # pick the region nearest your users
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /api/health
    numInstances: 1
    autoDeploy: false        # deploy on explicit trigger, not every push

    envVars:
      # --- runtime ---
      - key: DEBUG
        value: "false"       # MUST be false in prod (also arms the fail-closed JWT-secret guard)
      - key: LOG_LEVEL
        value: INFO
      - key: DIGITISATION_PAGE_ALLOWANCE
        value: "1500"        # monthly fair-use page allowance (warn-not-block)

      # --- auth ---
      - key: JWT_SECRET_KEY
        generateValue: true  # Render generates a strong secret (non-default => guard passes)

      # --- Supabase (PROD project) — set in dashboard ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false          # prod Postgres connection (migrations/admin scripts)

      # --- third-party keys — set in dashboard ---
      - key: OPENAI_API_KEY
        sync: false          # semantic search embeddings
      - key: LANDING_AI_API_KEY
        sync: false          # document parse/extract
      - key: VISION_AGENT_API_KEY
        sync: false

      # --- CORS: set to the EXACT prod frontend origin(s), comma-separated ---
      - key: CORS_ORIGINS
        sync: false          # e.g. https://app.surgiscan.co.za
